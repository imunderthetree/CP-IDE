name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify release inputs
        run: npm run check

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: CP-IDE v__VERSION__
          releaseBody: |
            Download the Windows installer from the assets below.

            Direct release page:
            https://github.com/imunderthetree/CP-IDE/releases/tag/v__VERSION__

            Changelog:
            https://github.com/imunderthetree/CP-IDE/blob/main/CHANGELOG.md
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
