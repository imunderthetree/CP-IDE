[package]
name = "cp-ide"
version = "1.0.0"
description = "A high-performance desktop IDE tailored for competitive programming."
authors = ["Yusuf", "imunderthetree"]
license = "MIT"
repository = "https://github.com/imunderthetree/CP-IDE"
homepage = "https://github.com/imunderthetree/CP-IDE"
readme = "../README.md"
keywords = ["competitive-programming", "ide", "tauri", "react"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cp_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
keyring = { version = "3", features = ["windows-native"] }
url = "2"
